name: Build Meteory IA APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 21 (Requerido para Capacitor Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Dependencias del Proyecto y Capacitor
        run: |
          npm ci || npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Compilar Proyecto Web Frontend
        run: npm run build

      - name: Inicializar y Sincronizar Capacitor Android
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Gradle wrapper no encontrado. Inicializando estructura nativa con Capacitor..."
            if [ -d "android" ]; then
              mkdir -p android_backup
              cp -r android/* android_backup/ || true
              rm -rf android
            fi
            npx cap init "Meteory IA" "com.meteory.ia" --web-dir dist || true
            npx cap add android
            if [ -d "android_backup" ]; then
              cp -r android_backup/* android/ || true
              rm -rf android_backup
            fi
          fi
          npx cap sync android

      - name: Insertar Permisos Especiales y Servicios Nativos en Android Project
        run: node scripts/inject-native-android.js

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Subir Archivo APK de Salida como Artefacto GitHub
        uses: actions/upload-artifact@v4
        with:
          name: MeteoryIA-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
